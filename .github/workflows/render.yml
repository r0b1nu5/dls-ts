on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Toolchain is pinned to the local teaching environment so that figure
      # sizes in the rendered slides match local renders (see dls-mlai).
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 1.7.31
          tinytex: true
      - name: Install Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install jupyter
      - run: pip install -r requirements.txt
      - name: Point Quarto at the setup-python interpreter
        run: echo "QUARTO_PYTHON=$(which python3)" >> "$GITHUB_ENV"
      - name: Report toolchain versions
        run: |
          quarto --version
          python --version
          echo "QUARTO_PYTHON=$QUARTO_PYTHON"
          python3 -c "import sys, yaml, jupyter_core; print(sys.executable, 'yaml', yaml.__version__)"
          pip show matplotlib numpy | grep -E '^(Name|Version)'
          quarto check jupyter 2>&1 | grep -E 'Version|Path|Jupyter|OK|ERROR' || true
      - name: Remove .onlyteacher blocks from .qmd files
        run: |
          for file in week*/*.qmd; do
            [ -f "$file" ] || continue  # Skip if not a regular file
            sed -i '/::: {.onlyteacher}/,/:::/d' "$file"
          done

      # This course has no Jupyter notebooks. If .ipynb files are added later, see
      # lse-dsc or dls-mlai for the "Remove Solution Cells", "Reformat jupyter
      # notebooks" and "Copy notebooks and data files to output" steps.

      - name: Render Book and Slides
        run: |
          quarto render --profile book

      - name: Compute slide source hashes
        id: slide-hashes
        run: |
          # Create a hash file for each slide source
          mkdir -p .slide-hashes
          for qmd in week*/*slides*.qmd; do
            [ -f "$qmd" ] || continue
            hash=$(sha256sum "$qmd" | cut -d' ' -f1)
            basename=$(basename "$qmd" .qmd)
            dirname=$(dirname "$qmd")
            echo "$hash" > ".slide-hashes/${dirname}-${basename}.hash"
          done
          # Create overall hash for cache key
          overall_hash=$(find .slide-hashes -type f -exec cat {} \; | sha256sum | cut -d' ' -f1)
          echo "hash=$overall_hash" >> $GITHUB_OUTPUT

      - name: Restore cached slide PDFs
        uses: actions/cache@v4
        id: pdf-cache
        with:
          path: |
            .cached-pdfs
            .cached-hashes
          key: slide-pdfs-${{ steps.slide-hashes.outputs.hash }}
          restore-keys: |
            slide-pdfs-

      - name: Build PDFs from slides (incremental)
        run: |
          mkdir -p .cached-pdfs .cached-hashes
          # Start web server for Decktape
          python3 -m http.server 8000 &
          SERVER_PID=$!
          sleep 2
          find ./_slides -name 'slides.html' | while read slide; do
            # Determine source file and cache paths
            week_dir=$(echo "$slide" | sed 's|./_slides/||' | cut -d'/' -f1)
            slide_name=$(basename "$slide" .html)
            cache_key="${week_dir}-${slide_name}"
            pdf_path="${slide%.html}.pdf"
            cached_pdf=".cached-pdfs/${cache_key}.pdf"
            cached_hash=".cached-hashes/${cache_key}.hash"
            current_hash=".slide-hashes/${cache_key}.hash"
            # Check if we need to rebuild
            needs_rebuild=true
            if [ -f "$cached_pdf" ] && [ -f "$cached_hash" ] && [ -f "$current_hash" ]; then
              if diff -q "$cached_hash" "$current_hash" > /dev/null 2>&1; then
                echo "✓ Using cached PDF for $slide"
                cp "$cached_pdf" "$pdf_path"
                needs_rebuild=false
              fi
            fi
            if [ "$needs_rebuild" = true ]; then
              echo "→ Building PDF for $slide"
              tmp_pdf_name="$(basename "$pdf_path")"
              tmp_pdf_path="/tmp/$tmp_pdf_name"
              clean_slide=$(echo "$slide" | sed 's|^\./||')
              docker run --rm -t --network=host -v "$(pwd)":/slides -v /tmp:/tmp \
                astefanutti/decktape "http://localhost:8000/$clean_slide" "$tmp_pdf_path"
              cp "/tmp/$tmp_pdf_name" "$pdf_path"
              # Update cache
              cp "$pdf_path" "$cached_pdf"
              [ -f "$current_hash" ] && cp "$current_hash" "$cached_hash"
            fi
          done
          kill $SERVER_PID 2>/dev/null || true

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          cp -a _book/. site/
          mv _slides site/slides

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 5
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      # dls.hevs.ch pulls the `site` artifact of this run itself (see new_upload/README.md):
      # the server downloads it with gh and rsyncs it into /var/www/html/ts. The destination
      # folder comes from the server allow-list. This course has no notebooks, so the
      # JupyterLite rebuild is skipped (build_notebooks=0).
      - name: Deploy to dls.hevs.ch
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ENDPOINT: https://dls.hevs.ch/deploy/
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${API_TOKEN}")
          resp=$(curl -sS --fail-with-body -G "${auth[@]}" "$ENDPOINT" \
                   --data-urlencode action=deploy \
                   --data-urlencode "repo=${GITHUB_REPOSITORY}" \
                   --data-urlencode "run_id=${GITHUB_RUN_ID}" \
                   --data-urlencode artifact=site \
                   --data-urlencode build_notebooks=0) || { echo "$resp"; exit 1; }
          echo "$resp"
          job=$(jq -r .job <<<"$resp")
          deadline=$((SECONDS + 10*60))
          while :; do
            s=$(curl -sS -G "${auth[@]}" "$ENDPOINT" --data-urlencode action=status \
                  --data-urlencode "job=$job" --data-urlencode lines=30)
            state=$(jq -r .status <<<"$s"); stage=$(jq -r '.stage // ""' <<<"$s")
            echo "[$(date -u +%T)] $state $stage"
            case "$state" in
              success) jq -r '.log_tail[]' <<<"$s"; exit 0 ;;
              failed)  jq -r '.log_tail[]' <<<"$s"; echo "::error::deploy failed (job $job)"; exit 1 ;;
            esac
            (( SECONDS < deadline )) || { jq -r '.log_tail[]' <<<"$s"; echo "::error::deploy timed out"; exit 1; }
            sleep 15
          done
